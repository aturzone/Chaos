  /* The code writes itself once the leaves are far enough apart. */
  const wantReveal = openness > 0.55 ? 1 : 0;
  if (wantReveal && qrReveal < 1) {
    qrReveal = clamp(qrReveal + dt / (reduceMotion ? 0.25 : 1.05), 0, 1);
    buildQrTexture(qrReveal);
  } else if (!wantReveal && qrReveal > 0 && state === S.CLOSING) {
    qrReveal = 0;
  }

  const blaze = clamp(0.30 + openness * 0.70, 0, 1);

  buildLights(t);
  frameCamera(false);

  spawnFire(openness, dt);
  spawnCandleFlames(t, dt);
  stepParticles(dt, t);

  /* --- paint -------------------------------------------------------- */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = rgb(C.void);
  ctx.fillRect(0, 0, W, H);
  /* a cold wash behind the altar, brighter as the rite intensifies */
  const bg = ctx.createRadialGradient(W/2, H*0.44, 0, W/2, H*0.44, Math.max(W,H)*0.62);
  bg.addColorStop(0, rgb(mix(C.void, C.flameDeep, 0.10 + blaze * 0.09)));
  bg.addColorStop(1, rgb(C.void));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  gctx.setTransform(1, 0, 0, 1, 0, 0);
  gctx.clearRect(0, 0, glow.width, glow.height);

  const P = window.__prof;
  const mark = P ? (k, t0) => { P[k] = (P[k] || 0) + (performance.now() - t0); } : null;
  let m0;

  m0 = P && performance.now();
  drawMist(t, blaze);
  drawDais();
  drawGroundLight(openness, t);
  drawSigil(t, blaze);
  for (const cd of CANDLES) drawCandle(cd, t);
  drawBook(t);
  drawParticles();
  if (P) { mark("build", m0); m0 = performance.now(); }

  flush();
  if (P) { mark("flush", m0); P.items = (P.items || 0) + qlen; m0 = performance.now(); }

  bloom();
  if (P) { mark("bloom", m0); m0 = performance.now(); }

  grade();
  if (P) { mark("grade", m0); P.frames = (P.frames || 0) + 1;
           P.fire = fire.length; P.embers = embers.length; }
}


/* ==================================================================== *
 * 12.  Go
 * ==================================================================== */

function start() {
  qrGrid = QR.encode(TARGET_URL, "Q");
  document.getElementById("dest-link").href = TARGET_URL;
  document.getElementById("dest-link").textContent =
    TARGET_URL.replace(/^https?:\/\//, "");

  buildSprites();
  buildLeftPage();
  buildQrTexture(0);
  buildCoverTexture();
  loadBrandmark();

  resize();
  window.addEventListener("resize", resize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

  liveEl.textContent = "A closed grimoire on a lit ritual circle. Activate to open it.";
  requestAnimationFrame((now) => { last = now; frame(now); });
}

/* Cinzel and Plex Mono are baked into the cover and the leaves, so the
   textures have to be built after the faces land -- a texture is drawn
   once and never redrawn, so a face that arrives late never appears.

   `fonts.ready` alone is not enough, and this looked fine for the wrong
   reason. A linked stylesheet declares its faces lazily, and NOTHING in
   this document is set in Cinzel -- it exists only inside canvas calls,
   which do not count. So `ready` can resolve having never fetched it.
   On a warm cache it worked; cold, the incantation would have set in
   Times. Ask for each face by name, cap the wait so a slow font server
   cannot hold the rite shut, and re-bake if the cap is what let us in. */
let started = false;
function once() { if (started) return; started = true; start(); }

function rebakeType() {
  buildLeftPage();
  buildCoverTexture();
  buildQrTexture(qrReveal);
}

if (document.fonts && document.fonts.load) {
  const faces = Promise.all([
    document.fonts.load('400 48px Cinzel'),
    document.fonts.load('600 48px Cinzel'),
    document.fonts.load('500 24px "IBM Plex Mono"'),
  ]);
  let timedOut = false;
  const capped = new Promise((res) => setTimeout(() => { timedOut = true; res(); }, 2500));
  Promise.race([faces, capped]).then(once, once);
  faces.then(() => { if (timedOut && started) rebakeType(); }, () => {});
} else {
  once();
}

/* Exposed for verification.

   A scan has to prove itself against the generator rather than against
   how the page looks, and a frame rate has to be measured rather than
   felt: set `window.__prof = {}` and the renderer accumulates per-stage
   milliseconds into it. `run()` draws frames without waiting on
   requestAnimationFrame, which a hidden tab never fires. */
window.__grimoire = {
  target: () => TARGET_URL,
  qr: () => qrGrid,
  qrCanvas: () => qrTex,
  open: () => { if (state === S.CLOSED) toggle(); },
  close: () => { if (state === S.OPEN) toggle(); },
  state: () => ["closed", "opening", "open", "closing"][state],
  openness: () => openness,
  /* Drive N frames at a fixed step. Used to render without a visible
     tab, and to settle the fire before a capture. */
  run: (frames, stepMs) => {
    const base = performance.now();
    for (let i = 0; i < frames; i++) renderFrame(base + i * (stepMs || 16.7));
    return { state: ["closed","opening","open","closing"][state], openness };
  },
};

})();
</script>
