[package]
name = "chaos-android"
description = "The JNI bridge: what the Kotlin app can call in the engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# **A cdylib, not an rlib.** Android loads a `.so` with `System.loadLibrary`,
# and only a cdylib produces one with the JNI symbols visible.
crate-type = ["cdylib"]

[dependencies]
chaos-probe = { path = "../../core/probe" }
# **The whole engine, not a second copy of it.** The phone had four modes and
# only CLIENT did anything. `chaos-serve` is a library now, so ALONE and CORE
# start the real server in-process -- same token loop, same API the Kotlin
# client already speaks.
chaos-serve = { path = "../../network/serve" }
chaos-model = { path = "../../core/model" }
