name: CI

# Chaos links against a prebuilt ggml. Rather than vendor it, each job builds
# ggml from llama.cpp and points GGML_LIB_DIR at the result — the same steps a
# contributor follows by hand, so a green CI means the documented steps work.
  #
# Linux and macOS have never been executed at runtime. These jobs are the first
# thing that will tell us whether the per-platform direct-I/O paths compile and
# whether the unit tests pass there.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # **The ggml source is pinned, so a green run means something tomorrow.**
  #
  # This used to be `git clone --depth 1`, which takes whatever llama.cpp's master
  # happens to be that day -- so "CI was green" was a statement about an unknown
  # commit, and a build that broke overnight was indistinguishable from one we
  # broke ourselves. 4g named it as the one line between "builds" and
  # "reproducible".
  #
  # Bumping this is a deliberate act: change the SHA, watch CI, and if the
  # arithmetic moves, VERIFIED_ARCHITECTURES is what says so. It also keys the
  # ggml cache, which is keyed on this file's hash.
  LLAMACPP_COMMIT: 90c26fcd4b2114b4aa39d09d69318cb8f438d27a
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback that needs no C toolchain at all.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  # Seven of the eight crates must keep building without ggml, and the eighth
  # must fail with instructions rather than a wall of unresolved imports. Both
  # halves are promises the README makes, so both are tested.
  without-ggml:
    name: usable without ggml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2

      - name: The ggml-free crates build, test and lint
        run: |
          # Every crate except chaos-arch. The README claims twelve of the thirteen are
          # usable on a machine that has never compiled a line of C, and this is
          # the only thing that makes that a fact rather than a hope --
          # chaos-jinja was missing from the list while the claim counted it.
          CRATES="-p chaos-gguf -p chaos-probe -p chaos-plan -p chaos-io -p chaos-model -p chaos-tokenizer -p chaos-grammar -p chaos-jinja -p chaos-ggml -p chaos-qr -p chaos-config -p chaos-http -p chaos-cli"
          cargo build $CRATES
          cargo test $CRATES
          cargo clippy $CRATES --all-targets -- -D warnings

      - name: chaos-arch fails with instructions, not with import errors
        run: |
          if cargo build -p chaos-arch 2>build.log; then
            echo "::error::chaos-arch built without ggml; the guard in its build.rs is not working"
            exit 1
          fi
          grep -q "GGML_LIB_DIR is not set" build.log \
            || { echo "::error::missing the actionable message"; cat build.log; exit 1; }
          grep -q "github.com/ggml-org/llama.cpp" build.log \
            || { echo "::error::error message does not tell the user what to do"; exit 1; }
          echo "chaos-arch failed correctly, with instructions."

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux }
          - { os: macos-latest,   name: macos }
          - { os: windows-latest, name: windows }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }

      - name: Use the GNU toolchain on Windows
        # ggml's static archives are produced by MSYS2's gcc and pull in libgomp,
        # which the MSVC linker cannot resolve.
        if: runner.os == 'Windows'
        # `rust-toolchain` installed clippy for the MSVC toolchain; switching
        # default does not bring components across, so add them here or the
        # lint step fails with "cargo-clippy.exe is not installed".
        run: |
          rustup default stable-x86_64-pc-windows-gnu
          rustup component add clippy --toolchain stable-x86_64-pc-windows-gnu

      # ggml must be built by the *same* toolchain that links it. The Visual
      # Studio generator emits COFF `.lib` archives, which the GNU linker Chaos
      # uses on Windows cannot consume, so MSYS2's mingw64 gcc builds it instead.
      # This mirrors the documented local setup exactly.
      - name: MSYS2 toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git

      - name: Put mingw64 on PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "D:/a/_temp/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - uses: Swatinem/rust-cache@v2

      - name: Cache the ggml build
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: ggml-libs
          key: ggml-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build ggml (Windows, MinGW)
        if: runner.os == 'Windows' && steps.ggml-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          git init llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp
          # A single commit, not a branch: GitHub serves an exact SHA.
          git fetch --depth 1 origin "$LLAMACPP_COMMIT"
          git checkout --detach FETCH_HEAD
          cd -
          cmake -S llama.cpp -B llama.cpp/build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DBUILD_SHARED_LIBS=OFF             -DLLAMA_BUILD_TESTS=OFF             -DLLAMA_BUILD_EXAMPLES=OFF             -DLLAMA_BUILD_SERVER=OFF             -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build llama.cpp/build --target ggml ggml-base ggml-cpu -j
          mkdir -p ggml-libs
          find llama.cpp/build \( -name 'libggml*.a' -o -name 'ggml*.a' \) -print | while read -r f; do
            cp "$f" "ggml-libs/$(basename "$f" | sed 's/^lib//')"
          done
          ls -la ggml-libs
          for lib in ggml-base ggml-cpu ggml; do
            test -f "ggml-libs/$lib.a"               || { echo "::error::ggml-libs/$lib.a missing after building ggml"; exit 1; }
          done

      # GGML_METAL / GGML_BLAS are OFF on purpose, and not as a size saving.
      # ggml's cmake enables both by default on Apple, and `ggml.a` contains
      # `ggml-backend-reg.cpp`, which names the registration symbol of every
      # ENABLED backend. Building only the three CPU archives while leaving
      # them on links fine right up until something touches the device
      # registry -- then macOS fails with
      #   Undefined symbols: _ggml_backend_metal_reg, _ggml_backend_blas_reg
      # which reads as a missing library rather than as a build that promised
      # backends it did not produce. Enable a backend here only alongside
      # building and staging its archive.
      - name: Build ggml (Unix)
        if: runner.os != 'Windows' && steps.ggml-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp
          # A single commit, not a branch: GitHub serves an exact SHA.
          git fetch --depth 1 origin "$LLAMACPP_COMMIT"
          git checkout --detach FETCH_HEAD
          cd -
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build llama.cpp/build --config Release --target ggml ggml-base ggml-cpu -j
          mkdir -p ggml-libs
          # Archive names and locations differ between generators, so collect
          # whatever landed and normalise the names build.rs expects.
          find llama.cpp/build \( -name 'libggml*.a' -o -name 'ggml*.a' \) -print | while read -r f; do
            cp "$f" "ggml-libs/$(basename "$f" | sed 's/^lib//')"
          done
          ls -la ggml-libs
          # Fail here rather than three steps later inside cargo: an empty
          # directory means ggml built shared libraries, which is llama.cpp's
          # default and the reason BUILD_SHARED_LIBS=OFF is set above.
          for lib in ggml-base ggml-cpu ggml; do
            test -f "ggml-libs/$lib.a" \
              || { echo "::error::ggml-libs/$lib.a missing after building ggml"; exit 1; }
          done

      - name: Build, lint and test
        shell: bash
        env:
          GGML_LIB_DIR: ${{ github.workspace }}/ggml-libs
        run: |
          cargo build --release --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --release --workspace | tee /tmp/test.log

      # The test count is quoted in STATUS.md, the README badge and CLAUDE.md,
      # and it has gone stale three times -- 566, 570, 575 -- each caught only
      # by someone noticing. Noticing is not a mechanism.
      - name: The documented test count is the real one
        shell: bash
        run: bash scripts/check-test-count.sh /tmp/test.log

      # The README carries three things and nothing else -- the progress bars,
      # the document map, and tok/s for five fixed models with the machine that
      # produced them named. Atur's rule, 2026-08-31. It was 393 lines and
      # claimed 13 architectures nine lines above 14; a rule in prose drifts.
      - name: The README obeys its own rule
        shell: bash
        run: bash scripts/check-readme.sh

      # **This step is honest about what it proves, and it is not much.** The
      # container-backed tests skip themselves when no model is on disk, so this
      # exercises the skip path. It is kept because a skip that panics is a real
      # regression, and removed from the sentence that used to imply more.
      - name: Container tests skip cleanly without a model
        shell: bash
        env:
          GGML_LIB_DIR: ${{ github.workspace }}/ggml-libs
        run: cargo test --release --workspace -- --ignored

      # ---------------------------------------------------------------------
      # The correctness gate. Everything above this line can be green while the
      # forward pass computes the wrong thing.
      #
      # `CLAUDE.md`: *a wrong forward pass produces fluent nonsense, never a
      # crash*. Until now the only defence was the `--ignored` tests above, run
      # with no model, which is why this repository could ship a regressed
      # engine with five green checks. A 397 MB model is a cheap price for the
      # one bug class the project says is the only one that matters.
      # ---------------------------------------------------------------------
      - name: Cache the test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: test-model
          key: qwen2-0_5b-instruct-q4_k_m-v1

      - name: Fetch the test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p test-model
          # The same URL shape `chaos-pull` uses, so if HuggingFace changes
          # this breaks here rather than in a user's download.
          URL=https://huggingface.co/Qwen/Qwen2-0.5B-Instruct-GGUF/resolve/main/qwen2-0_5b-instruct-q4_k_m.gguf
          curl -fL --retry 3 --retry-delay 5 -o test-model/Qwen2-0.5B-Instruct-Q4_K_M.gguf "$URL"
          # **Exit zero is not a model.** The trap `chaos-pull` documents and
          # `chaos verify` exists for: a redirect to an error page saves
          # perfectly and runs not at all. Checked here so a bad URL fails at
          # the download with a clear message rather than as a baffling test
          # failure three steps later.
          F=test-model/Qwen2-0.5B-Instruct-Q4_K_M.gguf
          SIZE=$(wc -c < "$F")
          test "$SIZE" -gt 100000000 \
            || { echo "::error::the model is only $SIZE bytes, which is an error page"; exit 1; }
          MAGIC=$(head -c 4 "$F")
          test "$MAGIC" = "GGUF" \
            || { echo "::error::the downloaded file does not start with GGUF"; exit 1; }
          echo "model: $SIZE bytes, magic GGUF"

      # Four layers, each with a measured sensitivity -- the table is in the
      # test's own header. `CHAOS_REQUIRE_MODEL_TESTS=1` is what stops this
      # becoming another green skip: with it, a missing model is a failure.
      #
      # **The byte-exact golden runs only where a golden for that platform
      # exists, and today that is `x86_64-windows` only.** It was recorded on a
      # laptop, so the Windows runner here is the first other machine to check
      # it -- if the two disagree, that is a real finding about how stable this
      # output is across machines, and it should be read rather than silenced.
      # Linux and macOS run the other three layers and say they have no golden.
      - name: The forward pass still computes what it computed
        shell: bash
        env:
          GGML_LIB_DIR: ${{ github.workspace }}/ggml-libs
          CHAOS_TEST_MODEL: ${{ github.workspace }}/test-model/Qwen2-0.5B-Instruct-Q4_K_M.gguf
          CHAOS_REQUIRE_MODEL_TESTS: "1"
        run: cargo test --release -p chaos-run --test forward_pass_is_not_broken -- --nocapture

      # **The window, opened like a person opens it.**
      #
      # v0.0.21 shipped with the mode knob painted underneath nine live child
      # windows: the app opened onto a screen with nothing usable, every unit
      # test passed, and `run-through.ps1` reported a clean pass -- because it
      # drives pages with `WM_COMMAND`, which goes neither through the rail nor
      # through the knob, so it walked an app that had never left its launch
      # screen. Nothing in CI touched the window at all.
      #
      # This presses RETURN and counts client-rects that are actually on screen
      # (`IsWindowVisible` is not 'on screen' -- `layout` parks unreachable rail
      # buttons at -3200,-3200). On this laptop: **0 at open, 12 after RETURN**.
      #
      # Deliberately not `run-through.ps1`, which documents its own hang modes
      # -- BROWSE and CHANGE MODE open modal dialogs and the next SendMessageW
      # never returns. A script that can hang can wedge a job for six hours.
      # `timeout-minutes` is the belt to that braces.
      #
      # It runs against a throwaway USERPROFILE, because the first version of
      # it wrote `mode_chosen` into the real settings file and then measured a
      # different thing on the second run.
      - name: The window opens and something is on it
        if: matrix.name == 'windows'
        timeout-minutes: 5
        shell: pwsh
        run: .\scripts\app-smoke.ps1 -TimeoutSeconds 90
